# GitLab CI configuration mirroring the GitHub Actions workflows
# (.github/workflows/tests.yml and docs.yml).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate pipelines for branches that already have an open MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

stages:
  - test
  - deploy

tests:
  stage: test
  script:
    - uv sync --dev
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run ty check
    - uv run pytest
    - uv export --format requirements-txt --no-hashes --no-emit-project -o requirements-audit.txt
    - uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make pandoc
  script:
    - uv sync --dev
    - uv run make -C docs html
    - mv docs/build/html public
  artifacts:
    paths:
      - public
